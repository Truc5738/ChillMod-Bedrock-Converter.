name: Convert ChillMod to Bedrock

on:
  workflow_dispatch:
  push:
    paths:
      - "input/chillmod.zip"
      - "converter/**"
      - ".github/workflows/convert.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert resource pack
        run: python converter/convert.py
      - name: Upload Bedrock pack and report
        uses: actions/upload-artifact@v4
        with:
          name: ChillMod-Bedrock-1.26.52
          path: |
            dist/ChillMod-1.3-Bedrock-1.26.52.mcpack
            dist/conversion-report.txt
          if-no-files-found: error
          retention-days: 14
