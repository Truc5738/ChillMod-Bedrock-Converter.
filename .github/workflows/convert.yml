name: Download and convert ChillMod to Bedrock

on:
  workflow_dispatch:
  push:
    paths:
      - "converter/**"
      - ".github/workflows/convert.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ChillMod Plant Package from CurseForge
        run: |
          mkdir -p input
          curl -fL --retry 3 --retry-delay 3 "https://www.curseforge.com/api/v1/mods/1705216/files/9021741/download" -o input/chillmod.zip
          file input/chillmod.zip
          unzip -t input/chillmod.zip
      - name: Download official Bedrock texture atlases
        run: |
          curl -fL --retry 3 "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/terrain_texture.json" -o input/terrain_texture.json
          curl -fL --retry 3 "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/textures/item_texture.json" -o input/item_texture.json
      - name: Convert Java textures to Bedrock vanilla overrides
        run: python converter/convert.py
      - name: Upload Bedrock pack and conversion report
        uses: actions/upload-artifact@v4
        with:
          name: ChillMod-Plant-Bedrock-1.26.52
          path: |
            dist/ChillMod-Plant-Bedrock-1.26.52.mcpack
            dist/conversion-report.txt
          if-no-files-found: error
          retention-days: 14
